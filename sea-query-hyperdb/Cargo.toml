[package]
name = "sea-query-hyperdb"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "HyperDB SQL dialect backend for sea-query"
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["database", "hyper", "sql", "sea-query", "query-builder"]
categories = ["database"]

[lints]
workspace = true

[dependencies]
sea-query = "1.0.2"

[dev-dependencies]
# path-only: no version pin so cargo doesn't try to resolve hyperdb-api against
# crates.io during `cargo publish` (same pattern as hyperdb-api-derive).
hyperdb-api = { path = "../hyperdb-api" }
